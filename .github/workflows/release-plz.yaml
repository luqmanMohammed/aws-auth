name: Release with release-plz
on:
  # The release pull request is kept current as commits land, so what is waiting to be
  # released is always visible. Merging it is the release; nothing publishes on its own.
  push:
    branches: [main]
  workflow_dispatch:

# Every write goes through the app token below, not through this one.
permissions:
  contents: read

jobs:
  release-pr:
    name: Release PR
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency:
      group: release-plz-pr
      cancel-in-progress: false
    steps:
      - uses: actions/create-github-app-token@v3
        id: app-token
        with:
          client-id: ${{ secrets.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write

      - uses: actions/checkout@v7
        with:
          # release-plz needs the full history to find the previous tag.
          fetch-depth: 0
          # Also what the branch push is authenticated with, since checkout is what
          # leaves credentials behind for git.
          token: ${{ steps.app-token.outputs.token }}

      - uses: dtolnay/rust-toolchain@stable

      - uses: release-plz/action@v0.5
        with:
          command: release-pr
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}

  release:
    name: Tag
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency:
      group: release-plz-tag
      cancel-in-progress: false
    steps:
      # The tag has to be pushed by the app rather than by GITHUB_TOKEN. GitHub does not
      # start workflow runs for pushes made with GITHUB_TOKEN, so a tag pushed with it
      # would never reach build.yaml and the release would never be built.
      - uses: actions/create-github-app-token@v3
        id: app-token
        with:
          client-id: ${{ secrets.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write

      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}

      - uses: dtolnay/rust-toolchain@stable

      # Tags only when Cargo.toml carries a version that has no tag yet, so ordinary
      # pushes to main do nothing. The tag then drives build.yaml.
      - uses: release-plz/action@v0.5
        with:
          command: release
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
