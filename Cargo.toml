[package]
name = "aws-auth"
version = "0.2.9"
edition = "2024"

[dependencies]
aws-config = "1.10.1"
aws-sdk-sso = "1.106.0"
aws-sdk-ssooidc = "1.108.0"
aws-sdk-sts = "1.111.0"
aws-sigv4 = "1.5.1"
aws-smithy-runtime-api = "1.14.0"
base64 = "0.23.1"
chrono = { version = "0.4.45", features = ["serde"] }
clap = { version = "4.6.6", features = ["derive", "env"] }
home = "0.5.12"
http = "1.5.0"
regex = "1.13.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.20"
tokio = { version = "1.53.1", features = ["full"] }
webbrowser = "1.2.4"

[profile.release]
lto = true
codegen-units = 1
strip = true
