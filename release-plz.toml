[workspace]
# Not a library, so it is never published to a registry. Versions therefore come from
# git tags rather than from crates.io.
publish = false
git_only = true

# The git tag is what drives build.yaml, which builds the artifacts and creates the
# GitHub release. Letting release-plz create the release too would mean two things
# competing to create the same one.
git_release_enable = false
git_tag_enable = true
git_tag_name = "v{{ version }}"

# Conventional Commits puts feat at minor. Below 1.0 release-plz instead follows cargo's
# compatibility rule, where minor is the breaking slot, and so demotes feat to patch.
# Nothing depends on this crate as a library, so the spec behaviour is the one that applies.
features_always_increment_minor = true

changelog_update = true

# Only the commit types that change the compiled binary open a release pull request.
# Without this a CI or test change bumps the version on its own, producing a release
# whose changelog section is empty because those types are skipped below. A chore that
# does alter the binary, such as a dependency or toolchain upgrade, belongs under build.
release_commits = "^(feat|fix|perf|refactor|build)[(:]"

[changelog]
# First match wins, so the two skips at the top have to precede the type rules: merge
# commits carry no type, and release-plz's own release commit would otherwise appear in
# the changelog it is writing.
commit_parsers = [
  { message = "^chore: release", skip = true },
  { message = "^Merge ", skip = true },
  { message = "^feat", group = "Added" },
  { message = "^fix", group = "Fixed" },
  { message = "^perf", group = "Performance" },
  { message = "^refactor", group = "Changed" },
  { message = "^docs", group = "Documentation" },
  { message = "^(build|ci)\\(deps", group = "Dependencies" },
  { message = "^(chore|ci|build|test|style)", skip = true },
  { message = ".*", skip = true },
]
